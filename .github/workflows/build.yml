name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # ubuntu-latest ya trae Docker, así que las pruebas de integración corren de verdad.
      # REQUIRE_DOCKER hace que se caigan en vez de saltearse si algún día no estuviera:
      # un build verde tiene que significar que corrieron.
      - name: mvn verify
        run: ./mvnw -B verify
        env:
          REQUIRE_DOCKER: "true"

      - name: Publicar reportes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-test
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore
